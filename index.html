    case 'codeOpen': { const t = b.dataset.t; showModal(`<div class="row"><h3 style="margin:0">Reset code</h3><span class="spacer"></span><button class="btn sm ghost" data-act="closeModal" aria-label="Close">✕</button></div>
      <p class="sub" style="margin:0">Pick a new 2-digit code for <b>${esc(tName(t))}</b>. The old code stops working right away, so let the manager know the new one.</p>
      <label class="f">New code<input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" id="ncCode" placeholder="00" autocomplete="off" style="width:90px;font-size:22px;letter-spacing:.3em;text-align:center"></label>
      <div class="row"><button class="btn primary" data-act="codeSave" data-t="${t}">Save code</button><button class="btn ghost" data-act="closeModal">Cancel</button></div>`); setTimeout(() => $('#ncCode')?.focus(), 0); break; }
    case 'codeSave': { const t = b.dataset.t, code = ($('#ncCode')?.value || '').trim();
      if(!/^\d{2}$/.test(code)) { toast('The code must be exactly 2 numbers.', true); break; }
      const h = await codeHash(t, code); closeModal(); await run(() => db.doc('teams/'+t).update({code:h}), `${tName(t)}’s code is now ${code}`); break; }
    case 'releaseTeam': { const t = b.dataset.t; if(!confirmStep('rel-'+t)) break;
      const T = S.teams[t]; await run(() => db.doc('teams/'+t).update({owner:null, mgr:null, code:null, colors:null, claimed:null, name:'Team #'+(T.order || (teamIds().indexOf(t)+1))}), 'Team released'); break; }
    case 'unassign': await run(()=>db.doc('teams/'+b.dataset.t).update({owner:null}), 'Manager removed'); break;
    case 'coComm': { const o = S.teams[b.dataset.t].owner; const list = c.commish.includes(o) ? c.commish.filter(x=>x!==o) : [...c.commish, o]; await run(()=>db.doc('league/config').update({commish:list}), 'Commissioners updated'); break; }
    case 'addTeam': { const v = $('#newTeam')?.value.trim(); if(!v) return toast('Type a team name first.', true); let id = slug(v), n=2; while(S.teams[id]) id = slug(v)+'-'+(n++);
        await run(()=>db.doc('teams/'+id).set({name:v, owner:null, roster:[], ir:[], order:teamIds().length+1}), 'Team added'); break; }
    case 'genSched': if(confirmStep('genSched')) await run(async () => {
        const weeks = roundRobin(teamIds(), c.regWeeks);
        const keep = S.schedule?.weeks || {};
        for(const k of Object.keys(keep)) if(+k > c.regWeeks) weeks[k] = keep[k];
        await db.doc('league/schedule').set({weeks});
      }, 'Schedule generated'); break;
    case 'seedSemis': { const st = standings(); if(st.length<4) return; await run(async () => {
        const weeks = clone(S.schedule?.weeks)||{}; weeks[c.regWeeks+1] = [{a:st[0].id,b:st[3].id},{a:st[1].id,b:st[2].id}];
        await db.doc('league/schedule').set({weeks}); }, 'Semifinals set'); break; }
    case 'seedFinal': await run(async () => {
        const sw = c.regWeeks+1, ms = matches(sw), win = m => score(m.a,sw) >= score(m.b,sw) ? m.a : m.b;
        const weeks = clone(S.schedule.weeks); weeks[c.regWeeks+2] = [{a:win(ms[0]), b:win(ms[1])}];
        await db.doc('league/schedule').set({weeks}); }, 'Championship set'); break;
    case 'ordUp': case 'ordDown': { const order = [...(S.draft?.order?.length ? S.draft.order : teamIds())]; const i=+b.dataset.i, j = a==='ordUp'?i-1:i+1; [order[i],order[j]]=[order[j],order[i]];
        await run(()=>db.doc('draft/state').set(Object.assign({rounds:c.rosterMax, picks:[], status:'setup'}, clone(S.draft)||{}, {order}))); break; }
    case 'shuffle': { const order = [...teamIds()]; for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
        await run(()=>db.doc('draft/state').set(Object.assign({rounds:c.rosterMax, picks:[], status:'setup'}, clone(S.draft)||{}, {order})), 'Order randomized'); break; }
    case 'startDraft': await run(()=>db.doc('draft/state').set(Object.assign({picks:[]}, clone(S.draft)||{}, {order: S.draft?.order?.length ? S.draft.order : teamIds(), rounds:c.rosterMax, status:'live'})), 'Draft is live'); location.hash = '#draft'; break;
    case 'pauseDraft': await run(()=>db.doc('draft/state').update({status:'setup'}), 'Draft paused'); break;
    case 'loadMock': if(confirmStep('loadMock')) await run(() => withLock(async () => {
        const m = S.mock; if(!m || !mockDone(m)) fail('Finish the mock draft first.');
        const by = {}; m.order.forEach(t => by[t] = []);
        m.picks.forEach(x => (by[x.team] = by[x.team] || []).push(x.pid));
        for(const t of teamIds()) await db.doc('teams/'+t).update({roster: by[t] || [], ir: []});
        await logTx({type:'commish', text:'Commissioner loaded mock draft rosters for testing'});
      }), 'Mock rosters loaded. Check the Teams page'); break;
    case 'clearRosters': if(confirmStep('clearRosters')) await run(() => withLock(async () => {
        for(const t of teamIds()) await db.doc('teams/'+t).update({roster: [], ir: []});
        for(const id of Object.keys(S.lineups)) await db.doc('lineups/'+id).delete();
        await logTx({type:'commish', text:'Commissioner cleared all rosters'});
      }), 'All rosters cleared'); break;
    case 'resetDraft': if(confirmStep('resetDraft')) await run(async () => {
        const d = S.draft; const taken = new Set((d?.picks||[]).map(p=>p.pid));
        for(const t of teamIds()){ const T = S.teams[t]; if((T.roster||[]).some(p=>taken.has(p))) await db.doc('teams/'+t).update({roster:(T.roster||[]).filter(p=>!taken.has(p))}); }
        await db.doc('draft/state').set({order:d?.order||teamIds(), rounds:c.rosterMax, picks:[], status:'setup'});
      }, 'Draft reset'); break;
    case 'importPool': await importPool(); break;
    case 'movePlayer': {
        const name = $('#mvQ')?.value || '', to = $('#mvTo')?.value, pos = $('#mvPos')?.value;
        const pid = Object.keys(S.players).find(p => keyOf(S.players[p].n) === keyOf(name));
        if(!pid) return toast('Pick a player from the list.', true);
        if(!to && !pos) return toast('Choose a team or a position to change.', true);
        await run(() => withLock(async () => {
          if(pos){ const players = clone(S.players); players[pid].pos = pos; await db.doc('league/players').set({p:players}); }
          if(to){
            const T = await freshTeams(), from = freshOwner(T)[pid] || null;
            if(from) await db.doc('teams/'+from).update({roster:(T[from].roster||[]).filter(p=>p!==pid), ir:(T[from].ir||[]).filter(p=>p!==pid)});
            const dest = to==='__fa' ? null : to;
            if(dest){ const R = dest===from ? (T[dest].roster||[]).filter(p=>p!==pid) : (T[dest].roster||[]); await db.doc('teams/'+dest).update({roster:[...R, pid]}); }
            await logTx({type:'move', team:dest, from, pid});
          }
        }), 'Player updated');
        break; }
    case 'saveSettings': {
        const num = (id, d) => { const v = parseFloat($('#'+id)?.value); return isNaN(v) ? d : v; };
        const sc = {}; for(const k of Object.keys(DEF.scoring)) sc[k] = num('sc-'+k, c.scoring[k]);
        const gs = {}; for(const k of Object.keys(DEF.gscoring)) gs[k] = num('gs-'+k, c.gscoring[k]);
        await run(()=>db.doc('league/config').update({
          name: $('#setName').value.trim() || c.name, season: $('#setSeason').value.trim() || c.season,
          regWeeks: Math.round(num('setWeeks', c.regWeeks)), rosterMax: Math.round(num('setRoster', c.rosterMax)), irMax: Math.round(num('setIR', c.irMax)),
          slots:{F:Math.round(num('setF',c.slots.F)), DT:Math.round(num('setDT',c.slots.DT)), G:Math.round(num('setG',c.slots.G))},
          scoring:sc, gscoring:gs }), 'Settings saved'); break; }
  }
});
document.addEventListener('change', async e => {
  const el = e.target, a = el.dataset?.act;
  if(a === 'setSlot') await setSlot(el.dataset.k, +el.dataset.i, el.value);

  else if(a === 'mockVar'){ S.mockVar = el.checked; }
  else if(a === 'mockMe'){ S.mockMe = el.value; }
  else if(a === 'statWeek'){ S.statWeek = +el.value; S.preview = null; render(); }
  else if(a === 'statMode'){ S.statMode = el.value; S.preview = null; render(); }
  else if((a === 'cpBgC' || a === 'cpFgC') && S.cp){ if($('#wName')) { S.wName = $('#wName').value; render(); } else if($('#etName')) { S.etName = $('#etName').value; openEditTeam(S.editT); } }
});
document.addEventListener('input', e => {
  const el = e.target, a = el.dataset?.act;
  if(a === 'pq'){ S.q = el.value; S.limit = 100; renderPlayerList(); }
  else if(a === 'dq'){ S.dq = el.value; renderDraftList(); }
  else if(a === 'mq'){ S.mq = el.value; renderMockList(); }
  else if(a === 'statText'){ S.statDraft = el.value; }
  else if(a === 'nllText'){ S.nllDraft = el.value; }
  else if(a === 'poolText'){ S.poolDraft = el.value; }
  else if((a === 'cpBgC' || a === 'cpFgC') && S.cp){ S.cp[a === 'cpBgC' ? 'bg' : 'fg'] = el.value; el.parentElement.style.background = el.value; cpLive(); }
  else if((el.id === 'wName' || el.id === 'etName') && S.cp){ cpLive(); }
});
let schedPinned = null, schedShown = null;
function showSched(pid, row){
  const box = $('#schedpop'); if(!box) return;
  const kind = row.dataset.kind || 'sched';
  if(schedShown !== pid+kind){ box.innerHTML = kind === 'card' ? playerCardHtml(pid) : schedPopHtml(pid); box.classList.toggle('pcard', kind === 'card'); schedShown = pid+kind; }
  box.hidden = false;
  box.style.pointerEvents = schedPinned ? 'auto' : 'none';
  const anchor = row;
  const r = anchor.getBoundingClientRect(), bw = box.offsetWidth, bh = box.offsetHeight, vw = innerWidth, vh = innerHeight;
  let left = r.right + 10; if(left + bw > vw - 12) left = Math.max(12, r.left - bw - 10);
  if(left + bw > vw - 12 || left < 12) left = Math.max(12, Math.min(vw - bw - 12, r.left));
  let top = r.top; if(left === Math.max(12, Math.min(vw - bw - 12, r.left))) top = r.bottom + 6;
  if(top + bh > vh - 12) top = Math.max(12, r.top - bh - 6);
  box.style.left = left + 'px'; box.style.top = top + 'px';
}
function hideSched(force){ if(schedPinned && !force) return; const box = $('#schedpop'); if(box){ box.hidden = true; } schedShown = null; if(force) schedPinned = null; }
document.addEventListener('mouseover', e => {
  if(!matchMedia('(hover: hover)').matches) return;
  const row = e.target.closest('[data-sched]');
  if(row && !schedPinned) showSched(row.dataset.sched, row);
});
document.addEventListener('mouseout', e => {
  const row = e.target.closest('[data-sched]');
  if(row && !row.contains(e.relatedTarget)) hideSched(false);
});
document.addEventListener('click', e => {
  if(e.target.closest('button,select,input,a')) return;
  const row = e.target.closest('[data-sched]');
  if(row){ const pid = row.dataset.sched; if(schedPinned === pid){ hideSched(true); } else { schedPinned = pid; showSched(pid, row); } return; }
  if(!e.target.closest('#schedpop')) hideSched(true);
}, true);
addEventListener('scroll', () => hideSched(true), true);
document.addEventListener('keydown', e => { if(e.key==='Escape') hideSched(true); });
document.addEventListener('keydown', e => { if(e.key==='Enter' && e.target.id==='wCode'){ e.preventDefault(); $('[data-act=wClaim],[data-act=wSignIn]')?.click(); } });
document.addEventListener('keydown', e => { if(e.key==='Enter' && (e.target.id==='pwIn' || e.target.id==='pw2')){ e.preventDefault(); $(e.target.id==='pwIn' ? '[data-act=pwUnlock]' : '[data-act=pwSet]')?.click(); } });
document.addEventListener('keydown', e => { if(e.key==='Escape' && !$('#overlay').hidden) closeModal(); });

function route(){
  const h = (location.hash||'').slice(1);
  S.view = VIEWS.some(([k])=>k===h) ? h : 'matchups';
  S.confirm = null; S.teamMenu = false; if(S.view === 'team') S.selTeam = null; window.scrollTo(0,0); render();
}
window.addEventListener('hashchange', route);

async function refreshNames(){
  if(!user) return;
  const ids = [...new Set(teamIds().map(t=>S.teams[t].owner).filter(Boolean))];
  if(!ids.length) return;
  const ps = await user.profiles(ids);
  let changed = false;
  for(const id of ids){ const n = ps[id]?.name || ''; if(S.names[id] !== n){ S.names[id] = n; changed = true; } }
  if(changed) requestRender();
}

async function init(){
  route();
  for(let i=0; i<150 && !(window.claude && window.claude.use); i++) await sleep(100);
  if(!(window.claude && window.claude.use)){ S.noDb = true; render(); return; }
  [db, user] = await Promise.all([window.claude.use('db').catch(()=>null), window.claude.use('user').catch(()=>null)]);
  if(user){
    [S.isOwner, S.me, S.canWrite, S.meInfo] = await Promise.all([user.isOwner(), user.id(), user.can('data.write'), user.me()]);
  }
  if(!db){ S.noDb = true; render(); return; }
  const onErr = e => { console.error(e); if(e && e.code==='revoked'){ S.noDb = true; render(); } };
  db.doc('league/config').onSnapshot(s => { S.config = s.exists ? s.data() : null; S.ready.config = true; recalc(); requestRender(); }, onErr);
  db.doc('league/players').onSnapshot(s => { S.players = (s.exists && s.data().p) || {}; recalc(); requestRender(); }, onErr);
  db.doc('league/schedule').onSnapshot(s => { S.schedule = s.exists ? s.data() : null; requestRender(); }, onErr);
  db.doc('draft/state').onSnapshot(s => { S.draft = s.exists ? s.data() : null; requestRender(); }, onErr);
  db.doc('nll/status').onSnapshot(s => { S.nll = s.exists ? s.data() : null; requestRender(); }, onErr);
  db.collection('teams').onSnapshot(q => { const t={}; q.docs.forEach(d=>t[d.id]=d.data()); S.teams = t; S.ready.teams = true; refreshNames(); requestRender(); }, onErr);
  db.collection('stats').onSnapshot(q => { const st={}; q.docs.forEach(d=>{ const x=d.data(); st[x.week || +d.id.slice(1)] = x; }); S.stats = st; recalc(); requestRender(); }, onErr);
  db.collection('lineups').onSnapshot(q => { const l={}; q.docs.forEach(d=>l[d.id]=d.data()); S.lineups = l; requestRender(); }, onErr);
  db.collection('trades').onSnapshot(q => { S.trades = q.docs.map(d=>Object.assign({id:d.id}, d.data())).sort((a,b)=>(b.ts||0)-(a.ts||0)); requestRender(); }, onErr);
  db.collection('transactions').orderBy('ts','desc').limit(300).onSnapshot(q => { S.tx = q.docs.map(d=>Object.assign({id:d.id}, d.data())); requestRender(); }, onErr);
}
init();
</script>
