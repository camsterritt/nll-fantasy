<title>NLL Fantasy League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a dark "arena boards" band (league name, week, tabs) over a cool off-white floor; content in one 1100px column */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface2:#F6F8FB; --ink:#101A2B; --muted:#5A6678; --line:#DCE2EA;
  --band:#0E1A2E; --band2:#18263F; --band-ink:#EEF2F8; --band-muted:#97A6BE;
  --accent:#D9500A; --accent-soft:#FCE8DC; --accent-ink:#FFFFFF;
  --win:#17824F; --win-soft:#DDF2E7; --loss:#BC3125; --loss-soft:#FAE2DF; --tie:#8A6A0E;
  --pF:#2459C4; --pF-soft:#E2EAFA; --pDT:#137A4B; --pDT-soft:#DCF1E5; --pG:#C2410C; --pG-soft:#FCE6D9;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1120; --surface:#111B2D; --surface2:#0D1626; --ink:#E6EBF3; --muted:#93A1B7; --line:#23314B;
  --band:#050B17; --band2:#122039; --band-ink:#EEF2F8; --band-muted:#8E9DB5;
  --accent:#FF7738; --accent-soft:#3A2115; --accent-ink:#160A03;
  --win:#3FC486; --win-soft:#123222; --loss:#F26B5E; --loss-soft:#3B1916; --tie:#DDB84E;
  --pF:#86A9FF; --pF-soft:#17264A; --pDT:#55CF95; --pDT-soft:#11301F; --pG:#FF8D52; --pG-soft:#3A2013; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1120; --surface:#111B2D; --surface2:#0D1626; --ink:#E6EBF3; --muted:#93A1B7; --line:#23314B;
  --band:#050B17; --band2:#122039; --band-ink:#EEF2F8; --band-muted:#8E9DB5;
  --accent:#FF7738; --accent-soft:#3A2115; --accent-ink:#160A03;
  --win:#3FC486; --win-soft:#123222; --loss:#F26B5E; --loss-soft:#3B1916; --tie:#DDB84E;
  --pF:#86A9FF; --pF-soft:#17264A; --pDT:#55CF95; --pDT-soft:#11301F; --pG:#FF8D52; --pG-soft:#3A2013; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td,th{font-variant-numeric:tabular-nums}

/* band */
.band{background:var(--band);color:var(--band-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:3px solid var(--accent)}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px 8px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 220px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{font-size:12px;color:var(--band-muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.weekctl{display:flex;align-items:center;gap:4px;background:var(--band2);border-radius:999px;padding:5px 18px}
.weekctl button{background:none;border:0;width:32px;height:32px;border-radius:999px;cursor:pointer;color:var(--band-ink);font-size:18px}
.weekctl button:hover:not(:disabled){background:rgba(255,255,255,.08)}
.weekctl button:disabled{opacity:.3;cursor:default}
.weekctl .lbl{min-width:132px;text-align:center;line-height:1.1}
.weekctl .lbl b{display:block;font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.weekctl .lbl small{font-size:11px;color:var(--band-muted);letter-spacing:.06em;text-transform:uppercase}
.who{font-size:13px;color:var(--band-muted);display:flex;align-items:center;gap:8px}
.who img{width:24px;height:24px;border-radius:50%}
.who b{color:var(--band-ink);font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-3px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;padding:10px 14px 11px;color:var(--band-muted);text-decoration:none;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.05em;text-transform:uppercase;border-bottom:3px solid transparent}
nav.tabs a:hover{color:var(--band-ink)}
nav.tabs a[aria-current="page"]{color:var(--band-ink);border-bottom-color:var(--band-ink)}

main{padding-block:22px 64px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase;margin:0}
.sub{color:var(--muted);font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:14px}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn.danger{color:var(--loss);border-color:var(--loss)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
input[type=text],input[type=number],input[type=password],select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-width:0}
textarea{width:100%;min-height:150px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;resize:vertical;box-sizing:border-box}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em}
label.f input,label.f select{color:var(--ink);font-weight:400;font-size:14px;letter-spacing:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.pos{display:inline-grid;place-items:center;min-width:22px;padding:0 4px;box-sizing:border-box;height:20px;border-radius:5px;font-size:11px;font-weight:700;font-family:var(--f-display);letter-spacing:.04em;flex:none;border:1px solid transparent}
.pos.p-F{color:var(--pF);background:var(--pF-soft)}
.pos.p-DT{color:var(--pDT);background:var(--pDT-soft)}
.pos.p-G{color:var(--pG);background:var(--pG-soft)}
.tb{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.05em;line-height:1;padding:3px 5px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)}
.pill.rook{padding:1px 6px;background:var(--surface2);color:var(--ink);border-color:var(--line)}
.tl{width:22px;height:22px;object-fit:contain;flex:none;vertical-align:middle}
.board .c .tl{width:15px;height:15px}
.board .h.me{color:var(--accent)}
.clock .btn{background:transparent;color:var(--band-ink);border-color:rgba(255,255,255,.35)}
.clock .btn:hover:not(:disabled){border-color:var(--band-ink)}
.board .c.mine{outline:2px solid var(--ink);outline-offset:-1px}
tr.meRow td{background:var(--accent-soft)}
.pill.inj{background:var(--loss-soft);color:var(--loss);border-color:var(--loss)}
.pill.gbye{background:var(--surface2);color:var(--muted);border-color:var(--line)}
.pill.gx2{background:var(--win-soft);color:var(--win);border-color:transparent}
.sn{font-size:10px;color:var(--muted);margin-left:3px}
.schedpop{position:fixed;z-index:25;width:min(380px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:12px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.sp-head{display:flex;align-items:center;gap:8px}
.sgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.sc{border-radius:5px;padding:4px 2px;text-align:center;line-height:1.15;font-size:11px}
.sc b{display:block;font-family:var(--f-display);font-size:13px}
.sc span{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc.game,.sw.game{background:#2E9E5B;color:#fff}
.sc.bye,.sw.bye{background:#D64535;color:#fff}
.sc.dbl,.sw.dbl{background:#F2C230;color:#1a1a1a}
.sc.po{outline:2px solid var(--ink);outline-offset:-2px}
.sc.po b{letter-spacing:.04em}
.sw.po{background:transparent;outline:2px solid var(--ink);outline-offset:-2px}
.pobye{background:#D64535;color:#fff;border-radius:6px;padding:5px 9px;font-size:12px;font-weight:700}
.stt{width:100%;border-collapse:collapse;font-size:12px}
.stt th{padding:3px 4px;text-align:center;font-size:10px;background:var(--surface2);border-bottom:1px solid var(--line)}
.stt td{padding:4px;text-align:center;font-weight:600;border-bottom:0}
.covt th.po{color:var(--accent);font-weight:800}
.covt th.po1,.covt td.po1{border-left:3px solid var(--ink) !important}
.covt td.po{box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}
b.warn{color:var(--loss)} b.good{color:var(--win)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
[data-sched]{cursor:pointer}
tr[data-sched]:hover td{background:var(--surface2)}
.covt{width:auto;border-collapse:separate;border-spacing:2px;font-size:12px}
.covt th,.covt td{padding:3px 0;border:0;background:none;text-align:center}
.covt th.cw{min-width:26px;font-size:11px;color:var(--muted)}
.covt th.cl{text-align:left;padding-right:6px;position:sticky;left:0;background:var(--surface)}
.covt td.cv{min-width:26px;height:20px;border-radius:4px;font-weight:700;font-variant-numeric:tabular-nums}
.covt td.ok{background:#2E9E5B}
.covt td.short{background:var(--accent-soft);color:var(--accent)}
.covt td.none{background:#D64535}
.covt sup{font-size:9px;margin-left:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.pill.live{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.win{background:var(--win-soft);color:var(--win);border-color:transparent}
.pill.loss{background:var(--loss-soft);color:var(--loss);border-color:transparent}

/* tables */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
td.pts{font-family:var(--f-display);font-weight:700;font-size:17px;text-align:right}
td.dim,span.dim{color:var(--muted)}
tr.cut td{border-bottom:2px dashed var(--accent)}
.pname{display:flex;align-items:center;gap:8px;min-width:0}
.pname b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname small{color:var(--muted);font-size:12px}

/* matchups */
.mugrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.mugrid{grid-template-columns:repeat(2,minmax(0,1fr))}}

.mu{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 0;cursor:pointer}
.mu:hover{border-color:var(--muted)}
.mu[aria-expanded="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.mu-row{display:grid;grid-template-columns:1fr auto auto;align-items:baseline;gap:10px;padding:6px 14px}
.mu-row .tm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-row .rec{font-size:12px;color:var(--muted)}
.mu-row .sc{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;min-width:46px;text-align:right;color:var(--muted)}
.mu-row.lead .sc{color:var(--ink)}
.mu-row.lead .tm::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:8px;vertical-align:middle}
.mu-foot{display:flex;justify-content:space-between;padding:4px 14px 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.box{table-layout:fixed}
.bx{max-width:720px;width:100%;margin:0 auto}
.bx-top{display:grid;grid-template-columns:1fr auto auto auto 1fr;align-items:center;gap:12px;padding:14px 16px;border-bottom:2px solid var(--ink)}
.bx-t{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.bx-t.r{text-align:right}
.bx-t b{font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bx-t span{font-size:12px;color:var(--muted)}
.bx-s{font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1;color:var(--muted)}
.bx-s.lead{color:var(--ink)}
.bx-vs{color:var(--muted);font-weight:700}
.bx-n.l{justify-content:flex-start;flex-direction:row-reverse}
@media (max-width:560px){.bx .tl{display:none}.bx-top{gap:6px;padding:12px}.bx-s{font-size:28px}.bx-t b{font-size:16px}.box .p{width:24px}.box td{padding:7px 3px}.box .mid{width:30px}.box .mid .pos{padding:1px 3px;font-size:9px}.bx-n b{font-size:13px;overflow:visible}.box .nm{max-width:none}}
.box td{padding:7px 8px}
.box .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box .mid{width:44px;text-align:center}
.box .p{width:46px;font-family:var(--f-display);font-weight:700;font-size:16px}
.box tfoot td{font-family:var(--f-display);font-weight:800;font-size:26px;border-top:2px solid var(--ink);border-bottom:0}
.box th{background:var(--surface)}

/* team chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.teamhead{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.teamhead .big{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.kv{display:flex;gap:22px;flex-wrap:wrap}
.kv div{display:flex;flex-direction:column}
.kv b{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.1}
.kv span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.slot{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface2);min-width:0}
.slot select{flex:1;min-width:0;border:0;background:none;padding:4px 2px;font-weight:600}
.slot .sp{font-family:var(--f-display);font-weight:700;font-size:16px;min-width:30px;text-align:right}
.slot.empty{border-style:dashed}

/* draft */
.clock{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--band);color:var(--band-ink);border-radius:10px;padding:14px 18px}
.clock .big{font-family:var(--f-display);font-weight:800;font-size:30px;text-transform:uppercase;line-height:1}
.clock small{color:var(--band-muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.board{display:grid;gap:4px;min-width:760px}
.board .h{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:14px;letter-spacing:.04em;padding:6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .c{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:12px;min-height:38px;min-width:0}
.board .c b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.board .c small{color:var(--muted)}
.board .c.now{border:2px solid var(--accent);background:var(--accent-soft)}
.board .c.pos-F{background:var(--pF-soft);box-shadow:inset 3px 0 0 var(--pF)}
.board .c.pos-DT{background:var(--pDT-soft);box-shadow:inset 3px 0 0 var(--pDT)}
.board .c.pos-G{background:var(--pG-soft);box-shadow:inset 3px 0 0 var(--pG)}

function normPos(p){

  if(['g','gk','goalie','goaltender','goalkeeper'].includes(k)) return 'G';
  if(['t','trans','transition'].includes(k)) return 'T';
  if(['d','dt','def','defence','defense','defenceman','defenseman'].includes(k)) return 'D';

}
/* fantasy points for one stat line */
function linePts(pos, s, c){
  if(!s) return null;

}
function fieldFor(h){
  const k = String(h||'').toLowerCase().replace(/[^a-z]/g,'');

  return null;
}
/* parse pasted table (tab, comma or multi-space separated) */
function parseTable(text, opts={}){
  const lines = String(text||'').split(/\r?\n/).filter(l => l.trim());
  if(!lines.length) return {error:'Nothing pasted yet.'};
  const first = lines[0];
  const delim = first.includes('\t') ? '\t' : first.includes(',') ? ',' : /\s{2,}/;
  const split = l => l.split(delim).map(c => c.trim().replace(/^"(.*)"$/,'$1').trim());
  let head = split(first).map(fieldFor);
  let body = lines.slice(1);
  const hasName = head.includes('name') || (head.includes('first') && head.includes('last'));
  if(!hasName){
    if(opts.defaultCols){ head = opts.defaultCols; body = lines; }
    else return {error:'The first row needs column headings, including a Name (or Player) column.'};
  }
  const rows = [];
  for(const l of body){
    const cells = split(l); const r = {};
    head.forEach((f,i) => {
      if(!f || cells[i] === undefined) return;
      const v = cells[i];
      if(f==='name'||f==='first'||f==='last'||f==='team') r[f] = v;
      else if(f==='pos') r.pos = normPos(v);
      else { const n = parseFloat(String(v).replace(/,/g,'')); r[f] = isNaN(n) ? 0 : n; }
    });
    if(!r.name && (r.first||r.last)) r.name = [r.first,r.last].filter(Boolean).join(' ');
    if(!r.name || !keyOf(r.name)) continue;
    if(keyOf(r.name) === 'total' || keyOf(r.name) === 'totals') continue;
    r.name = r.name.replace(/\s+/g,' ').trim();
    rows.push(r);
  }
  const fields = STAT_FIELDS.filter(f => head.includes(f));
  return {rows, fields, cols:head.filter(Boolean)};
}

function nameKeys(n){
  const parts = String(n||'').replace(/\s+/g,' ').trim().split(' ').filter(Boolean);
  const out = new Set([keyOf(n)]);
  const core = parts.length > 2 ? parts.filter((p,i) => i===0 || !/^[A-Za-z]\.?$/.test(p)) : parts;
  out.add(keyOf(core.join(' ')));
  if(parts.length > 2) out.add(keyOf(parts[0]+' '+parts[parts.length-1]));
  const first = keyOf(core[0]), rest = keyOf(core.slice(1).join(' '));
  for(const s of NICKS) if(s.includes(first)) for(const alt of s) out.add(alt+rest);
  return [...out].filter(Boolean);
}

}

}
function tallySum(lines){

}
const abbrKey = name => { const parts = String(name||'').trim().split(/\s+/); return keyOf(parts[0][0] + parts.slice(1).join(' ')); };

    if(gm && gid === gm[1]) hit = {w:+w, gid, g};

function boxLine(r, pts){

}
/* round-robin schedule (circle method), repeated to fill regWeeks */
function roundRobin(ids, weeks){
  const t = [...ids]; if(t.length % 2) t.push(null);
  const n = t.length, rounds = [];
  for(let r=0; r<n-1; r++){
    const pairs = [];
    for(let i=0;i<n/2;i++){ const a=t[i], b=t[n-1-i]; if(a && b) pairs.push(r%2 ? {a:b,b:a} : {a,b}); }

    t.splice(1, 0, t.pop());
  }

  for(let w=1; w<=weeks; w++) out[w] = rounds[(w-1) % rounds.length];

}

const nllWeekOf = fw => FW2NLL[fw-1];
const teamGames = (abbr, fw) => { const w = nllWeekOf(fw); return w && GAMES[w] ? (GAMES[w][abbr]||0) : 0; };
const gamesFor = (pid, fw) => teamGames(pl(pid).t, fw);

function oppText(abbr, fw){ const g = NLL_SCHED[nllWeekOf(fw)]||[]; return g.filter(x=>x[0]===abbr||x[1]===abbr).map(x=>x[0]===abbr?'@ '+x[1]:'vs '+x[0]).join(', '); }

  const n = gamesFor(pid, fw), t = pl(pid).t; if(!t || !nllWeekOf(fw)) return '';

/* lineup coverage: for each fantasy week, how many rostered players at each slot have a game */
function coverage(pids){
  const c = cfg(), weeks = Math.min(maxWeek(), FW2NLL.length), out = [];
  for(let fw=1; fw<=weeks; fw++){
    const cnt = {F:0, DT:0, G:0}, dbl = {F:0, DT:0, G:0};
    for(const p of pids){ const g = gamesFor(p, fw), s = slotOf(pl(p).pos); if(g>0) cnt[s]++; if(g>1) dbl[s]++; }
    const short = ['F','DT','G'].reduce((a,s)=>a+Math.max(0, c.slots[s]-cnt[s]), 0);
    out.push({fw, cnt, dbl, short, full: short===0});
  }
  return out;
}

function slotTableHtml(pids, title){

  const fill = {};   // fill[fw][slot] = players with a game, best first
  let full = 0;
  for(let fw=1; fw<=weeks; fw++){
    fill[fw] = {F:[], DT:[], G:[]};
    for(const p of pids) if(gamesFor(p, fw) > 0) fill[fw][slotOf(pl(p).pos)].push(p);
    for(const k in fill[fw]) fill[fw][k].sort((a,b)=>(gamesFor(b,fw)*sVal(b))-(gamesFor(a,fw)*sVal(a)));

      return `<th class="cw ${po?'po':''} ${po==='SF'?'po1':''}" title="${esc(weekName(i+1))} · ${esc(weekDates(i+1))}">${po || (i+1)}</th>`; }).join('')}</tr>`;

function nextUp(pid){

        ${S.wErr ? '<div class="note" style="color:var(--loss)">That code isn’t right.</div>' : ''}
        <div class="row"><button class="btn primary" data-act="wSignIn">Sign in</button><button class="btn ghost" data-act="wBack">Back</button></div></div>`;

  return `<div class="wl"><div class="wl-head"><div class="eyebrow">${esc(cfg().name)}</div><h2>${mt && !sel ? 'Welcome back' : 'Pick your team'}</h2>${mt && !sel ? '' : '<p class="sub">Open teams are free to claim: give it a name, colours and a 2-digit code.</p>'}</div>
    ${cont}${mt && !sel ? '<div class="wl-or">or pick another team</div>' : ''}
    <div class="wl-grid${mt && !sel ? ' small' : ''}">${ids.map(card).join('')}</div>${form}
    ${window.__FB && S.cmOpen ? `<div class="card stack wl-form"><h3>Commissioner sign-in</h3><label class="f">Commissioner code<input type="password" inputmode="numeric" maxlength="8" id="cmCode" placeholder="••••" autocomplete="off"></label>${S.cmErr ? '<div class="note" style="color:var(--loss)">That code isn’t right.</div>' : ''}<div class="row"><button class="btn primary" data-act="cmSignIn">Sign in</button><button class="btn ghost" data-act="cmToggle">Cancel</button></div></div>` : ''}
    <div class="wl-skip"><button class="linkbtn" data-act="wSkip">Just looking →</button>${window.__FB && !S.isOwner && !S.cmOpen ? '<button class="linkbtn" data-act="cmToggle">Commissioner</button>' : ''}</div></div>`;
}
function canWrite(){ return S.canWrite !== false && !S.readonlyHit; }
function weekName(w){ const c=cfg(); return w===c.regWeeks+1 ? 'Semifinals' : w===c.regWeeks+2 ? 'Championship' : 'Week '+w; }
function maxWeek(){ return cfg().regWeeks + 2; }
function weekState(w){ const c=cfg(); if(w < c.currentWeek) return 'final'; if(w === c.currentWeek) return c.locked ? 'live' : 'open'; return 'upcoming'; }
const STATE_LABEL = {final:'Final', live:'Lineups locked', open:'Lineups open', upcoming:'Upcoming'};
function ownerMap(){
  if(memo.owner) return memo.owner;
  const m = {};
  for(const t of teamIds()){ for(const p of S.teams[t].roster||[]) m[p]=t; for(const p of S.teams[t].ir||[]) m[p]=t; }
  return memo.owner = m;
}
function pts(pid, w){ const s = S.stats[w]?.p?.[pid]; return s ? linePts(pl(pid).pos, s, cfg()) : null; }
function recalc(){
  const c = cfg(), out = {};
  for(const [w, st] of Object.entries(S.stats)){
    for(const [pid, s] of Object.entries(st.p||{})){
      const v = linePts(pl(pid).pos, s, c); if(v == null) continue;
      const o = out[pid] || (out[pid] = {tot:0, wk:0, gp:0});
      o.tot += v; o.wk++; o.gp += (s.gp || 1);
    }
  }
  S.season = out;
  // each player's most recent game: weeks in order, games by date then save time
  const last = {}, log = {};
  for(const w of Object.keys(S.stats).map(Number).sort((a,b)=>a-b)){
    const st = S.stats[w];
    for(const [pid, s] of Object.entries(st.man||(!st.games ? st.p : {})||{})){ last[pid] = {pts: linePts(pl(pid).pos, s, c), w, s}; (log[pid] ||= []).push(last[pid]); }
    const gs = Object.values(st.games||{}).sort((a,b)=>String(a.date).localeCompare(String(b.date)) || (a.ts||0)-(b.ts||0));
    for(const g of gs) for(const [pid, s] of Object.entries(g.p||{})){
      const t = pl(pid).t, opp = t===g.a ? g.h : t===g.h ? g.a : '';
      const mine = t===g.h ? g.gh : t===g.a ? g.ga : null, theirs = t===g.h ? g.ga : t===g.a ? g.gh : null;
      last[pid] = {pts: linePts(pl(pid).pos, s, c), w, opp, date:g.date, s, home: t===g.h, res: mine==null||theirs==null ? '' : mine>theirs ? 'W' : mine<theirs ? 'L' : 'T', sc: mine==null ? '' : `${mine}–${theirs}`};
      (log[pid] ||= []).push(last[pid]);
    }
  }
  S.last = last; S.log = log;
}
const sTot = pid => S.season[pid]?.tot || 0;
function posRank(pid){
  if(!memo.prk){ const o = {}, g = {}; for(const [k,P] of Object.entries(S.players)) if(P.proj != null) (g[posKey(P.pos)] ||= []).push(k);
    for(const arr of Object.values(g)) arr.sort((a,b) => S.players[b].proj - S.players[a].proj).forEach((k,i) => o[k] = i+1); memo.prk = o; }
  return memo.prk[pid] || 0;
}
const projOf = pid => S.players[pid]?.proj ?? null;
const sVal = pid => sTot(pid) || projOf(pid) || 0;   // season points, or 2027 projection before games
const sAvg = pid => { const s=S.season[pid]; return s && s.gp ? s.tot/s.gp : 0; };
const fmt = v => v == null ? '–' : (Math.round(v*10)/10).toString();

/* lineups */
function emptyLineup(){ const c=cfg().slots; return {F:Array(c.F).fill(null), DT:Array(c.DT).fill(null), G:Array(c.G).fill(null)}; }
function normLineup(l){
  const out = emptyLineup();
  for(const k of ['F','DT','G']) (l?.[k]||[]).slice(0,out[k].length).forEach((p,i)=>out[k][i]=p||null);
  return out;
}
function fillLineup(tid, l, w, open){
  const t = S.teams[tid]; const roster = (t?.roster||[]);
  const used = new Set([...l.F,...l.DT,...l.G].filter(Boolean));
  for(const k of ['F','DT','G']){
    const wv = p => (w ? gamesFor(p, w) : 1) * sVal(p) + sVal(p)/1000;   // games this week x value
    const pool = roster.filter(p => !used.has(p) && slotOk(k, pl(p).pos)).sort((a,b)=>wv(b)-wv(a));
    for(let i=0;i<l[k].length;i++) if(!l[k][i] && (!open || open[k].includes(i)) && pool.length){ const p=pool.shift(); l[k][i]=p; used.add(p); }
  }
  return l;
}
function lineupFor(tid, w){
  const key = 'lu:'+tid+':'+w; if(memo[key]) return memo[key];
  const st = weekState(w), past = st==='final' || st==='live';
  let base = null, exact = !!S.lineups[tid+'_w'+w], sub = !!S.lineups[tid+'_w'+w]?.submitted;
  for(let k=w; k>=1; k--){ if(S.lineups[tid+'_w'+k]){ base = normLineup(S.lineups[tid+'_w'+k]); break; } }
  let l = base || emptyLineup();
  if(!((past || sub) && exact)){
    const r = new Set(S.teams[tid]?.roster||[]);
    const open = {F:[], DT:[], G:[]};
    for(const k of ['F','DT','G']) l[k] = l[k].map((p,i) => { if(p && r.has(p) && slotOk(k, pl(p).pos)) return p; if(!base || p) open[k].push(i); return null; });
    l = fillLineup(tid, l, w, open);
  }
  return memo[key] = l;
}
const isSubmitted = (tid, w) => !!S.lineups[tid+'_w'+w]?.submitted;
async function submitLineup(on){
  const tid = S.selTeam, w = S.week, l = clone(lineupFor(tid, w));
  await run(() => db.doc(`lineups/${tid}_w${w}`).set({team:tid, week:w, F:l.F, DT:l.DT, G:l.G, by:S.me||null, ts:Date.now(), submitted:on, subTs: on ? Date.now() : null}), on ? 'Lineup submitted' : 'Lineup unlocked for changes');
}
function score(tid, w){
  const key='sc:'+tid+':'+w; if(memo[key]!=null) return memo[key];
  const l = lineupFor(tid, w); let s = 0;
  for(const k of ['F','DT','G']) for(const p of l[k]) if(p) s += pts(p, w) || 0;
  return memo[key] = Math.round(s*10)/10;
}
function matches(w){ return (S.schedule?.weeks?.[w] || []).filter(m => S.teams[m.a] && S.teams[m.b]); }
function standings(){
  if(memo.stand) return memo.stand;
  const c = cfg(), rec = {};
  for(const t of teamIds()) rec[t] = {id:t, w:0, l:0, t:0, pf:0, pa:0, res:[]};
  const last = Math.min(c.currentWeek-1, c.regWeeks);
  for(let w=1; w<=last; w++) for(const m of matches(w)){
    const a=score(m.a,w), b=score(m.b,w), A=rec[m.a], B=rec[m.b];
    A.pf+=a; A.pa+=b; B.pf+=b; B.pa+=a;
    if(a>b){A.w++;B.l++;A.res.push('W');B.res.push('L');} else if(b>a){B.w++;A.l++;A.res.push('L');B.res.push('W');} else {A.t++;B.t++;A.res.push('T');B.res.push('T');}
  }
  const list = Object.values(rec).map(r => { const gp=r.w+r.l+r.t; r.pct = gp ? (r.w+r.t/2)/gp : 0; return r; });
  list.sort((x,y)=> y.pct-x.pct || y.w-x.w || y.pf-x.pf);
  return memo.stand = list;
}
function recStr(tid){ const r = standings().find(x=>x.id===tid); if(!r) return ''; return r.t ? `${r.w}-${r.l}-${r.t}` : `${r.w}-${r.l}`; }
function streak(res){ if(!res.length) return '–'; const l=res[res.length-1]; let n=0; for(let i=res.length-1;i>=0&&res[i]===l;i--) n++; return l+n; }

function vMatchups(){
  const w = S.week, ms = matches(w), st = weekState(w);
  if(!ms.length){
    const why = w > cfg().regWeeks ? 'Playoff matchups appear once the commissioner seeds them from the final standings.' : 'The commissioner hasn’t generated the schedule yet.';

  }

  const cards = ms.map((m,i) => {
    const a=score(m.a,w), b=score(m.b,w);
    const row = (t,s,o) => `<div class="mu-row ${s>o?'lead':''}${tc(t)}"${tcs(t)}><span class="tm">${teamDot(t)}${esc(tName(t))}${isSubmitted(t, w) ? ' <span class="subok" title="Lineup submitted">✓</span>' : ''}</span><span class="rec">${recStr(t)}</span><span class="sc num">${fmt(s)}</span></div>`;

    <div class="row"><h2>${esc(weekName(w))}</h2><span class="pill ${st==='live'?'live':''}">${STATE_LABEL[st]}</span>${S.stats[w] ? `<span class="sub">Stats updated ${new Date(S.stats[w].updated||0).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span>`:''}</div>
    <div class="mugrid">${cards}</div>
    ${boxScore(m, w)}
  </div>`;
}
function boxScore(m, w){
  const A = lineupFor(m.a,w), B = lineupFor(m.b,w);
  const rows = [];
  const lab = {F:'F', DT:'D/T', G:'G'};
  for(const k of ['F','DT','G']) for(let i=0;i<A[k].length;i++){
    const pa=A[k][i], pb=B[k][i];
    const cell = (p, left) => p ? `<div class="pname bx-n${left?' l':''}"><b><span class="hide-sm">${esc(pl(p).n)}</span><span class="only-sm">${esc(pl(p).n.split(' ').slice(1).join(' ') || pl(p).n)}</span></b>${teamBadge(pl(p).t)}</div>` : `<span class="dim">Empty</span>`;
    rows.push(`<tr><td class="p">${fmt(pa?pts(pa,w):null)}</td><td class="nm r">${cell(pa, true)}</td><td class="mid"><span class="pos p-${k}">${lab[k]}</span></td><td class="nm">${cell(pb)}</td><td class="p r">${fmt(pb?pts(pb,w):null)}</td></tr>`);
  }
  const sa = score(m.a,w), sb = score(m.b,w);
  return `<div class="card flush bx">
    <div class="bx-top"><div class="bx-t${tc(m.a)}"${tcs(m.a)}><b>${teamDot(m.a)}${esc(tName(m.a))}</b><span>${esc(recStr(m.a)||'0-0')}</span></div><div class="bx-s${sa>sb?' lead':''}">${fmt(sa)}</div><div class="bx-vs">–</div><div class="bx-s${sb>sa?' lead':''}">${fmt(sb)}</div><div class="bx-t r${tc(m.b)}"${tcs(m.b)}><b>${esc(tName(m.b))}${teamDot(m.b)}</b><span>${esc(recStr(m.b)||'0-0')}</span></div></div>
    <div class="tbl"><table class="box"><tbody>${rows.join('')}</tbody></table></div></div>`;
}

    ${grid ? `<h3>Weekly scores</h3>${grid}<p class="sub">Green is a win. Hover a score to see the opponent.</p>` : ''}

function mgrName(tid){ const T = S.teams[tid]; if(T?.mgr) return T.mgr; const o = T?.owner; if(!o) return T?.code ? 'Manager' : 'Unclaimed'; return S.names[o] || 'Manager'; }

/* ---- Teams ---- */
function vTeam(){
  const ids = teamIds();
  if(!ids.length) return emptyCard('No teams yet','The commissioner adds teams under Commissioner.');
  const mt = myTeam();
  if(!S.selTeam || !S.teams[S.selTeam]) S.selTeam = mt || ids[0];
  const tid = S.selTeam, t = S.teams[tid], mine = tid===mt, w = S.week, c = cfg();
  const editable = (mine || isCommish()) && canWrite();
  const submitted = isSubmitted(tid, w);
  const lineupEditable = editable && (weekState(w)==='open' || weekState(w)==='upcoming') && !submitted;
  const canSubmit = editable && (weekState(w)==='open' || weekState(w)==='upcoming');
  const st = standings(), r = st.find(x=>x.id===tid) || {w:0,l:0,t:0,pf:0}, place = st.findIndex(x=>x.id===tid) + 1;
  const m = matches(w).find(x => x.a===tid || x.b===tid), opp = m ? (m.a===tid ? m.b : m.a) : null;
  const my = score(tid, w), their = opp ? score(opp, w) : null;
  const pv = p => S.season[p] ? sAvg(p) : (projOf(p) || 0);
  const nmRec = id => `${teamDot(id)}${esc(tName(id))} <span class="rec">(${esc(recStr(id)||'0-0')})</span>`;
  const projBy = id => { const l = lineupFor(id, w), o = {F:0, DT:0, G:0, games:0}; for(const kk of ['F','DT','G']) for(const p of l[kk]) if(p && !nllInj(p)){ const g = gamesFor(p, w); o[kk] += g * pv(p); o.games += g; } o.tot = o.F + o.DT + o.G; return o; };
  const myP = projBy(tid), opP = opp ? projBy(opp) : null;

const ordinal = n => n + (['th','st','nd','rd'][(n%100-20)%10] || ['th','st','nd','rd'][n%100] || 'th');
/* lineup spot picker */
function openActivate(pid, keep){

  const rows = (t.roster||[]).slice().sort((a,b) => (order[pl(a).pos]??3) - (order[pl(b).pos]??3) || val(a) - val(b));
  const wk = q => { const g = gamesFor(q, w); return g === 0 ? '<span class="pill gbye">Bye</span>' : `<span class="sub">${esc(oppText(pl(q).t, w))}</span>`; };
  showModal(`<div class="ad-hero">${posChip(P.pos)}<div class="ad-nm"><b>Activate ${esc(P.n)}</b><span>Your roster is full (${(t.roster||[]).length}/${c.rosterMax}). Pick someone to drop.</span></div>${teamBadge(P.t)}<div class="ad-v"><b>${fmt(val(pid))}</b><span>${S.season[pid] ? 'PPG' : 'Proj/G'}</span></div></div>
    <div class="ad-list">${rows.map(q => `<button class="ad-row" data-act="actDrop" data-p="${esc(q)}" aria-pressed="${drop===q}"><span class="ad-radio"></span>${posChip(pl(q).pos)}<span class="ad-rn"><b>${esc(pl(q).n)}</b>${wk(q)}</span>${teamBadge(pl(q).t)}<span class="ad-rv">${fmt(val(q))}</span></button>`).join('')}</div>
    <div class="ad-foot"><div class="ad-sum"><span class="ai add">+</span><b>${esc(P.n)}</b>${drop ? `<span class="ai drop">−</span><b>${esc(pl(drop).n)}</b>` : ''}</div>

function openStart(pid){

function openSlot(k, i, mode){
  const tid = S.selTeam, t = S.teams[tid], w = S.week, L = lineupFor(tid, w), cur = L[k][i], lab = {F:'Forward', DT:'Defence / transition', G:'Goalie'};
  const where = {}; for(const kk of ['F','DT','G']) L[kk].forEach((p,j) => { if(p) where[p] = kk+(j+1); });
  let cands = (t.roster||[]).filter(p => slotOk(k, pl(p).pos)).sort((a,b) => (gamesFor(b,w)>0) - (gamesFor(a,w)>0) || sVal(b) - sVal(a));

function filteredPlayers(q, pos, st, sort){
  const own = ownerMap(); const k = keyOf(q);
  let list = Object.keys(S.players).filter(p => {
    const P = S.players[p];
    if(pos!=='all' && posKey(P.pos)!==pos) return false;
    if(st==='fa' && own[p]) return false;
    if(st==='own' && !own[p]) return false;
    if(k && !keyOf(P.n).includes(k) && keyOf(P.t)!==k) return false;
    return true;
  });
  const by = {gp:p=>-(S.season[p]?.gp||0), proj:p=>-(projOf(p)??-99), season:p=>-sTot(p), avg:p=>-sAvg(p), week:p=>-(pts(p,S.week)||0), last:p=>-(S.last?.[p]?.pts ?? -99), name:()=>0, rank:p=>S.players[p].rk||9999};
  if(sort === 'name'){ list.sort((a,b) => S.players[a].n.localeCompare(S.players[b].n)); return list; }
  const f = by[sort] || by.season;
  list.sort((a,b)=> f(a)-f(b) || (S.players[a].rk||9999)-(S.players[b].rk||9999) || S.players[a].n.localeCompare(S.players[b].n));
  return list;
}

/* ---- Mock draft (local only, nothing is saved) ---- */
const slotOf = pos => pos==='G' ? 'G' : pos==='F' ? 'F' : 'DT';
function mockTeamAt(m, i){ const n = m.order.length, r = Math.floor(i/n), k = i%n; return m.order[r%2 ? n-1-k : k]; }
function mockStart(me, variety){
  const c = cfg(), order = S.draft?.order?.length ? S.draft.order : teamIds(), n = order.length;
  const own = ownerMap();
  const pool = Object.keys(S.players).filter(p => projOf(p) != null && !own[p] && pl(p).t);
  const need = {F:c.slots.F*n, DT:c.slots.DT*n, G:c.slots.G*n}, repl = {};
  for(const s of ['F','DT','G']){ const a = pool.filter(p=>slotOf(pl(p).pos)===s).map(projOf).sort((x,y)=>y-x); repl[s] = a[need[s]] ?? 0; }
  const T = {}; order.forEach(t => T[t] = {F:0, DT:0, G:0, n:0});
  S.mock = {order, rounds:c.rosterMax, picks:[], me: me || null, variety, repl, T, avail:new Set(pool), at:Date.now()};
  S.mq = ''; S.mpos = 'all';
  mockAdvance();
}
function mockTotal(m){ return m.order.length * m.rounds; }
function mockDone(m){ return m.picks.length >= mockTotal(m) || !m.avail.size; }
/* why a pick is or isn't allowed for team t right now */
function mockRule(m, team, pid){
  const c = cfg(), t = m.T[team], s = slotOf(pl(pid).pos), starter = t[s] < c.slots[s];
  const left = m.rounds - t.n;
  const unmet = Math.max(0,c.slots.F-t.F) + Math.max(0,c.slots.DT-t.DT) + Math.max(0,c.slots.G-t.G);
  if(s==='G' && t.G >= 2) return {ok:false, why:'Already have two goalies'};
  if(left <= unmet && !starter) return {ok:false, why:'Fill your starting spots first'};
  return {ok:true, starter};
}
function mockScored(m, team){
  const out = [];
  for(const p of m.avail){
    const r = mockRule(m, team, p); if(!r.ok) continue;
    const s = slotOf(pl(p).pos);
    let v = projOf(p) - m.repl[s];                     // value over a replacement starter
    if(!r.starter) v = s==='G' ? v*0.15 - 4 : v*0.45;  // bench depth is worth less
    out.push([v, p]);
  }
  return out.sort((a,b)=>b[0]-a[0]);
}
function mockTake(m, pid){
  const i = m.picks.length, team = mockTeamAt(m, i), t = m.T[team];
  m.avail.delete(pid); t[slotOf(pl(pid).pos)]++; t.n++;
  m.picks.push({pid, team, pick:i+1, round:Math.floor(i/m.order.length)+1});
}
function mockCpu(m){
  const team = mockTeamAt(m, m.picks.length), sc = mockScored(m, team);
  if(!sc.length){ m.avail.clear(); return; }
  let j = 0;
  if(m.variety && sc.length > 2){ const x = Math.random(); j = x < .6 ? 0 : x < .85 ? 1 : 2; }
  mockTake(m, sc[j][1]);
}
function mockAdvance(){ const m = S.mock; while(!mockDone(m) && mockTeamAt(m, m.picks.length) !== m.me) mockCpu(m); }
function mockUserPick(pid){
  const m = S.mock; if(!m || mockDone(m)) return;
  const team = mockTeamAt(m, m.picks.length);
  if(team !== m.me || !m.avail.has(pid)) return;
  const r = mockRule(m, team, pid); if(!r.ok) return toast(r.why, true);
  mockTake(m, pid); mockAdvance();
}
function mockAutoMine(){ const m = S.mock; if(!m || mockDone(m)) return; mockCpu(m); mockAdvance(); }
function mockSimRest(){ const m = S.mock; if(!m) return; m.me = null; mockAdvance(); }
function mockSummary(){
  const c = cfg(), m = S.mock, by = {};
  m.order.forEach(t => by[t] = []);
  m.picks.forEach(p => by[p.team].push(p.pid));
  return m.order.map(t => {
    const ps = by[t], used = new Set(); let tot = 0;
    for(const s of ['G','DT','F']){
      ps.filter(p => slotOf(pl(p).pos)===s).sort((a,b)=>projOf(b)-projOf(a)).slice(0, c.slots[s]).forEach(p => { tot += projOf(p); used.add(p); });
    }
    const bench = ps.filter(p => !used.has(p));
    const cnt = s => ps.filter(p => posKey(pl(p).pos)===s).length;
    return {t, tot, bench: bench.reduce((a,p)=>a+projOf(p),0)/Math.max(1,bench.length), F:cnt('F'), DT:cnt('DT'), G:cnt('G'),
            top: ps.slice().sort((a,b)=>projOf(b)-projOf(a)).slice(0,3)};
  }).sort((a,b)=>b.tot-a.tot);
}
function boardHtml(order, rounds, picks, nowIdx, showProj, me){
  const n = order.length, cells = [];

  for(let r=0;r<rounds;r++){
    let row = `<div class="rn">${r+1}</div>`;
    for(let k=0;k<n;k++){
      const idx = r*n + (r%2 ? n-1-k : k), pk = picks[idx], now = nowIdx === idx;
      row += pk ? `<div class="c pos-${posKey(pl(pk.pid).pos)} ${pk.team===me?'mine':''}"><b>${esc(pl(pk.pid).n)}</b><small>${teamBadge(pl(pk.pid).t)}${posLab(pl(pk.pid).pos)} · ${showProj ? fmt(projOf(pk.pid)) + '/G' : `${r+1}.${(idx%n)+1}`}</small></div>`

}

/* ---- Activity ---- */
function vActivity(){
  const NLL_ONLY = new Set(['draft','nllteam','nlladd','newplayer']);
  if(!S.tx.some(x => !NLL_ONLY.has(x.type))) return `<div class="stack"><h2>Activity</h2>${emptyCard('No moves yet','Adds, drops, trades and IR moves show up here.')}</div>`;
  const P = (id, logo=true) => `<span class="ap">${posChip(pl(id).pos)}<b>${esc(pl(id).n)}</b>${logo?teamBadge(pl(id).t):''}</span>`;
  const G = (...a) => `<span class="ag">${a.join('')}</span>`;
  const ic = (cls, t, tip) => `<span class="ai ${cls}"${tip?` title="${esc(tip)}"`:''}>${t}</span>`;
  const arrow = '<span class="aa" aria-hidden="true">→</span>';
  const tm = id => `<span class="at">${tPill(id)}</span>`;
  const IRp = '<span class="pill inj">IR</span>';
  const nll = '<span class="pill">NLL</span>';
  let lastDay = '';
  // NLL trades are logged one player at a time; show the ones made together as one trade
  const feed = [];
  for(let i = 0; i < S.tx.length; i++){
    const x = S.tx[i];
    if(NLL_ONLY.has(x.type)) continue;   // draft picks live on the Draft page; NLL moves aren't fantasy moves
    if(x.type === 'nllteam' && x.how === 'trade'){
      const grp = [x]; let j = i + 1;
      while(j < S.tx.length && S.tx[j].type === 'nllteam' && S.tx[j].how === 'trade' && Math.abs((S.tx[j].ts||0) - (x.ts||0)) < 30*60e3){ grp.push(S.tx[j]); j++; }
      const tos = [...new Set(grp.map(g => g.to))];
      if(grp.length > 1 && tos.length === 2){ feed.push({type:'nlltrade', ts:x.ts, sides: tos.map(t => [t, grp.filter(g => g.to === t).map(g => g.pid)])}); i = j - 1; continue; }
    }
    feed.push(x);
  }
  const NLLN = {BUF:'Buffalo',CGY:'Calgary',COL:'Colorado',GA:'Georgia',HFX:'Halifax',LV:'Las Vegas',OSH:'Oshawa',ROC:'Rochester',SD:'San Diego',SSK:'Saskatchewan',TOR:'Toronto',VAN:'Vancouver'};
  const tgSide = (head, ps, logos) => `<div class="tg-side"><div class="tg-head">${head}</div><div class="tg-rec">Receives</div>${ps.map(id => `<div class="tg-p">${posChip(pl(id).pos)}<b>${esc(pl(id).n)}</b>${logos ? teamBadge(pl(id).t) : ''}</div>`).join('')}</div>`;
  const tg = (a, b) => `<div class="tg">${a}<div class="tg-mid" aria-hidden="true">⇄</div>${b}</div>`;
  const items = feed.map(x => {
    const d = new Date(x.ts||0), day = d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
    let who = '', what = '', tip = '';
    switch(x.type){
      case 'add': who = tm(x.team); what = `${G(ic('add','+','Added'),P(x.add))}${x.drop?G(ic('drop','−','Dropped'),P(x.drop)):''}`; break;
      case 'drop': who = tm(x.team); what = G(ic('drop','−','Dropped'),P(x.drop)); break;
      case 'ir': who = tm(x.team); what = `${P(x.pid)}${arrow}${IRp}`; tip = x.auto ? `Automatic: NLL ${x.list||'injured list'}` : ''; break;
      case 'activate': who = tm(x.team); what = `${P(x.pid)}${G(arrow,'<span class="pill gx2">Active</span>')}`; tip = x.auto ? 'Automatic: NLL activated him' : ''; break;
      case 'irflag': who = tm(x.team); what = `${P(x.pid)}<span class="pill inj">IR full</span>`; tip = 'On an NLL injured list, but this team’s IR is full'; break;
      case 'draft': who = tm(x.team); what = `${ic('pk','#'+x.pick,'Draft pick '+x.pick)}${P(x.pid)}`; break;
      case 'nllteam': who = nll; what = x.how === 'release' ? G(P(x.pid,false), arrow, '<span class="pill">Released</span>') : G(P(x.pid,false),arrow,teamBadge(x.to)); tip = x.how === 'trade' ? 'NLL trade' : x.how === 'release' ? 'Released'+(x.from?' by '+(NLL_CITY[x.from]||x.from):'') : 'NLL signing'; break;
      case 'nlladd': case 'newplayer': who = nll; what = `${ic('add','+','Added to the player pool')}${P(x.pid)}`; tip = `Signed with ${x.to}${x.type==='newplayer'?'; no past stats, so check his position':''}`; break;
      case 'move': who = '<span class="pill">Commish</span>'; what = `${P(x.pid)}${arrow}${x.team ? tm(x.team) : '<span class="sub">Free agent</span>'}`; tip = x.from ? `From ${tName(x.from)}` : ''; break;
      case 'trade': who = '<span class="pill">Trade</span>'; what = tg(tgSide(tPill(x.a), x.aGets||[], true), tgSide(tPill(x.b), x.bGets||[], true)); break;
      case 'nlltrade': who = '<span class="pill">NLL trade</span>'; what = tg(...x.sides.map(([t,ps]) => tgSide(`${teamBadge(t)}<span>${esc(NLLN[t]||t)}</span>`, ps, false))); break;
      case 'commish': who = '<span class="pill">Commish</span>'; what = `<span class="sub">${esc(String(x.text||'').replace(/^Commissioner /,''))}</span>`; break;
      default: what = esc(x.text||x.type);
    }
    if(x.checked) tip = '';
    const head = day !== lastDay ? `<li class="aday">${esc(day)}</li>` : ''; lastDay = day;
    return `${head}<li class="arow"${tip?` title="${esc(tip)}"`:''}><div class="aw">${who}</div><div class="am">${what}</div><time datetime="${d.toISOString()}">${d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}</time></li>`;
  }).join('');
  return `<div class="stack"><h2>Activity</h2><div class="card flush"><ul class="feed">${items}</ul></div></div>`;
}

let toastT;
function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className=err?'err':''; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, err?6000:2600); }
function showModal(html){ const o=$('#overlay'); o.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`; o.hidden=false; }

const sleep = ms => new Promise(r=>setTimeout(r,ms));
function dbErr(e){
  if(e && e.code==='invalid_argument' && S.canWrite==null){ S.readonlyHit = true; render(); return 'This account can only view the league. Ask the commissioner to invite you as an Editor.'; }
  if(e && e.code==='quota_exceeded') return 'The league database is full. ' + (e.message||'');
  return (e && e.message) || 'Something went wrong saving that. Try again.';
}
async function run(fn, ok){
  if(!db) return;
  if(!canWrite()){ toast('This account can only view the league.', true); return; }
  S.busy = true;
  try{ await fn(); if(ok) toast(ok); }
  catch(e){ toast(e && e.user ? e.message : dbErr(e), true); console.error(e); }
  finally{ S.busy = false; requestRender(); }
}
const fail = m => { const e = new Error(m); e.user = true; throw e; };
async function withLock(fn){
  const ref = db.doc('locks/moves'); const holder = S.me || ('v-'+Math.random().toString(36).slice(2));
  for(let i=0;i<10;i++){
    const r = await ref.acquire({holder, ttlMs:8000});
    if(r.acquired) return await fn();
    await sleep(500 + Math.random()*500);
  }
  fail('Another move is in progress. Try again in a few seconds.');
}
async function freshTeams(){ const q = await db.collection('teams').get(); const t={}; q.docs.forEach(d=>t[d.id]=clone(d.data())); return t; }
function freshOwner(T){ const m={}; for(const [id,t] of Object.entries(T)){ (t.roster||[]).forEach(p=>m[p]=id); (t.ir||[]).forEach(p=>m[p]=id); } return m; }
const logTx = x => db.collection('transactions').add(Object.assign({ts:Date.now(), by:S.me||null, week:cfg().currentWeek}, x));
/* ---- pasted NLL transactions (same rules as the scheduled sync) ---- */
const NLL_TEAMS = [['BUF',['buffalo','bandits']],['CGY',['calgary','roughnecks']],['COL',['colorado','mammoth']],['GA',['georgia','geogia','swarm']],['HFX',['halifax','thunderbirds']],['LV',['las vegas','desert dogs']],['OSH',['oshawa','firewolves']],['ROC',['rochester','knighthawks']],['SD',['san diego','seals']],['SSK',['saskatchewan','rush']],['TOR',['toronto','rock']],['VAN',['vancouver','warriors']]];
const teamIn = str => { const x = String(str||'').toLowerCase(); for(const [a,ks] of NLL_TEAMS) if(ks.some(k => new RegExp('\\b'+k+'\\b').test(x))) return a; return null; };
const MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];
const isInj = l => /injured reserve|physically unable/i.test(l||'');
const isAct = l => /active roster|practice/i.test(l||'');
function splitNames(x){
  return String(x||'').replace(/\bgoalie\b|\bgoaltender\b|\bforward\b|\bdefen[cs]eman\b|\btransition\b/gi,'').replace(/\s+and\s+/g, ',').split(',').map(n => n.trim().replace(/^(?:and)\s+/i,'')).filter(n => n && /[A-Za-z]/.test(n) && !/pick|round|draft|consideration|future|rights/i.test(n));
}
function parseNllLine(text){
  const t = text.trim().replace(/\s+/g,' ').replace(/\.$/,''), acts = [];
  const first = t.split(/ (?:have|has) /)[0], team = teamIn(first);
  let m;
  if((m = t.match(/announced the retirement of (.+)$/i))) splitNames(m[1]).forEach(n => acts.push({kind:'retire', name:n}));
  else if((m = t.match(/(?:have|has) traded (.+?) to the (.+?)(?: in exchange for (.+))?$/i))){
    const to = teamIn(m[2]); splitNames(m[1]).forEach(n => acts.push({kind:'join', name:n, team:to, how:'trade'}));
    if(m[3]) splitNames(m[3]).forEach(n => acts.push({kind:'join', name:n, team, how:'trade'}));
  }
  else if((m = t.match(/(?:have|has) acquired (.+?) from the (.+?)(?: in exchange for (.+))?$/i))){
    const from = teamIn(m[2]); splitNames(m[1]).forEach(n => acts.push({kind:'join', name:n, team, how:'trade'}));
    if(m[3]) splitNames(m[3]).forEach(n => acts.push({kind:'join', name:n, team:from, how:'trade'}));
  }
  else if((m = t.match(/(?:have|has) (?:re-)?signed (.+?) to (?:an? )?.*?(?:agreement|contract|deal)(.*)$/i)) || (m = t.match(/(?:have|has) claimed (.+?) (?:off|from) .*?()$/i))){
    const rest = m[2] || '', pm = rest.match(/placed (?:him|them|her) on the (.+?)(?: from the (.+))?$/i);
    splitNames(m[1]).forEach(n => acts.push({kind:'join', name:n, team, how:'signing', toList: pm ? pm[1] : null, fromList: pm ? pm[2] : null}));
  }
  else if((m = t.match(/(?:have|has) placed (.+?) on the (.+?)(?: from the (.+))?$/i))){
    splitNames(m[1]).forEach(n => acts.push(/retired list/i.test(m[2]) ? {kind:'retire', name:n} : {kind:'move', name:n, team, toList:m[2], fromList:m[3]||null}));
  }
  else if((m = t.match(/(?:have|has) released (.+?)(?: from the (.+))?$/i))) splitNames(m[1]).forEach(n => acts.push({kind:'release', name:n, team}));
  return {team, acts};
}
function parseNllPaste(raw){
  const out = []; let date = null;
  for(const line0 of String(raw||'').split(/\r?\n/)){
    const line = line0.trim(); if(!line) continue;
    let m = line.match(/^(?:[A-Za-z]+day,?\s+)?([A-Za-z]+)\s+(\d{1,2}),\s*(\d{4})$/);
    if(m && MONTHS.includes(m[1].toLowerCase())){ date = `${m[3]}-${String(MONTHS.indexOf(m[1].toLowerCase())+1).padStart(2,'0')}-${m[2].padStart(2,'0')}`; continue; }
    let text = line;
    m = line.match(/^(\d{4}-\d\d-\d\d)\s*\|\s*(.+)$/); if(m){ date = m[1]; text = m[2]; }
    if(!/ (?:have|has) /.test(text)) continue;
    out.push({date: date || new Date().toISOString().slice(0,10), text, ...parseNllLine(text)});
  }
  return out;
}
async function previewNll(){
  const raw = $('#nllText')?.value || ''; S.nllDraft = raw;
  if(!S.extra){ try { const d = await db.doc('nll/extra').get(); S.extra = d.exists ? (d.data().players || {}) : {}; } catch(e){ S.extra = {}; } }
  const pIdx = nameIndex(S.players), xIdx = nameIndex(S.extra), seen = new Set(S.nll?.seen || []);
  const items = parseNllPaste(raw).map(it => {
    const key = `${it.date} | ${it.text.replace(/\.$/,'')}.`, done = seen.has(key) || seen.has(`${it.date} | ${it.text}`);
    const fx = it.acts.map(a => { const pid = findIn(pIdx, S.players, a.name, a.team), xid = pid ? null : findIn(xIdx, S.extra, a.name); return {...a, pid, xid}; });
    return {...it, key, done, fx};
  });
  S.nllPv = {items};
}
function nllFxText(a){
  const nm = a.pid ? pl(a.pid).n : a.xid ? S.extra[a.xid].n : a.name, P = a.pid ? pl(a.pid) : null;
  const inj = a.toList && isInj(a.toList) ? ' → <span class="pill inj">IR</span>' : a.fromList && isInj(a.fromList) ? ' → <span class="pill gx2">off IR</span>' : '';
  if(a.kind === 'retire') return a.pid ? `<b>${esc(nm)}</b> retired` : `<span class="dim">${esc(nm)} retired (not in the pool)</span>`;
  if(a.kind === 'release') return a.pid ? (P.t && a.team && P.t !== a.team ? `<span class="dim">${esc(nm)} released by ${esc(a.team)}, but he’s listed with ${esc(P.t)}: no change</span>` : `<b>${esc(nm)}</b> → <span class="pill">Released</span>`) : `<span class="dim">${esc(nm)} released (not in the pool)</span>`;
  if(a.kind === 'join'){
    if(!a.team) return `<span class="warn">${esc(nm)}: couldn’t tell which team</span>`;
    if(!a.pid) return `<b>${esc(nm)}</b> added to the pool → ${teamBadge(a.team)} ${a.xid ? `<span class="sub">(${fmt(S.extra[a.xid].proj)} proj from past stats)</span>` : '<span class="sub">(no past stats; check his position)</span>'}${inj}`;
    return P.t === a.team ? `<b>${esc(nm)}</b> ${a.how==='signing'?'re-signed':'stays'} with ${teamBadge(a.team)}${inj}` : `<b>${esc(nm)}</b> → ${teamBadge(a.team)} <span class="sub">(${a.how})</span>${inj}`;
  }
  if(a.kind === 'move'){
    if(!a.pid) return `<span class="dim">${esc(nm)} (not in the pool)</span>`;
    if(isInj(a.toList)) return `<b>${esc(nm)}</b> → <span class="pill inj">IR</span> <span class="sub">${esc(a.toList)}</span>`;
    if(a.fromList && isInj(a.fromList)) return `<b>${esc(nm)}</b> off the injured list → <span class="sub">${esc(a.toList)}</span>`;

async function applyNll(){
  const pv = S.nllPv; if(!pv) return;
  const todo = pv.items.filter(it => !it.done);
  if(!todo.length){ toast('Nothing new to apply.', true); return; }
  await run(() => withLock(async () => {
    const pd = clone((await db.doc('league/players').get()).data()), P = pd.p;
    const sd = clone((await db.doc('nll/status').get()).data() || {players:{}, seen:[]}); sd.players ||= {}; sd.seen ||= [];
    const T = await freshTeams(), c = cfg(), logs = [], changedT = new Set(); let added = false;
    const ownerOf = pid => Object.keys(T).find(id => (T[id].roster||[]).includes(pid) || (T[id].ir||[]).includes(pid));
    const injure = (pid, list, it) => { sd.players[pid] = {list, date:it.date, text:it.text}; const tid = ownerOf(pid); if(tid && (T[tid].roster||[]).includes(pid)){
      if((T[tid].ir||[]).length < c.irMax){ T[tid].roster = T[tid].roster.filter(x=>x!==pid); T[tid].ir = [...(T[tid].ir||[]), pid]; changedT.add(tid); logs.push({type:'ir', auto:true, team:tid, pid, list}); }
      else logs.push({type:'irflag', team:tid, pid}); } };
    const heal = (pid, activate) => { delete sd.players[pid]; const tid = ownerOf(pid);
      if(activate && tid && (T[tid].ir||[]).includes(pid) && (T[tid].roster||[]).length < c.rosterMax){ T[tid].ir = T[tid].ir.filter(x=>x!==pid); T[tid].roster = [...(T[tid].roster||[]), pid]; changedT.add(tid); logs.push({type:'activate', auto:true, team:tid, pid}); } };
    for(const it of todo){
      for(const a0 of it.fx){
        const a = {...a0};
        if(a.kind === 'join' && a.team){
          if(!a.pid){
            let id = a.xid || slug(a.name), n = 2; const base = id; while(P[id]) id = base+'-'+(n++);
            if(a.xid){ const x = S.extra[a.xid]; P[id] = {n:x.n, pos:x.pos, t:a.team, added:it.date}; for(const f of ['proj','gp3','ls','rook','role']) if(x[f] != null) P[id][f] = x[f]; logs.push({type:'nlladd', pid:id, to:a.team, proj:x.proj ?? null}); }
            else { P[id] = {n:a.name, pos:'F', t:a.team, added:it.date, rook:{y:null, pk:null}}; logs.push({type:'newplayer', pid:id, to:a.team}); }
            a.pid = id; added = true;
          } else if(P[a.pid] && P[a.pid].t !== a.team){ const from = P[a.pid].t || ''; P[a.pid].t = a.team; delete P[a.pid].rel; logs.push({type:'nllteam', pid:a.pid, to:a.team, from, how:a.how, auto:true}); }
          if(a.toList && isInj(a.toList)) injure(a.pid, a.toList, it);
          else if(a.fromList && isInj(a.fromList)) heal(a.pid, isAct(a.toList));
        } else if(a.kind === 'move' && a.pid && P[a.pid]){
          if(isInj(a.toList)) injure(a.pid, a.toList, it);
          else if(a.fromList && isInj(a.fromList)) heal(a.pid, isAct(a.toList));
        } else if((a.kind === 'release' || a.kind === 'retire') && a.pid && P[a.pid]){
          if(a.kind === 'release' && P[a.pid].t && a.team && P[a.pid].t !== a.team) continue;
          const from = P[a.pid].t || ''; P[a.pid].t = ''; P[a.pid].rel = it.date; heal(a.pid, false);
          logs.push({type:'nllteam', pid:a.pid, to:'', from, how:'release', auto:true});
        }
      }
      sd.seen.unshift(it.key);
      if(!sd.lastDate || it.date > sd.lastDate) sd.lastDate = it.date;
    }
    if(added) Object.keys(P).filter(k => P[k].proj != null).sort((a,b) => P[b].proj - P[a].proj).forEach((k,i) => P[k].rk = i+1);
    sd.seen = sd.seen.slice(0, 400); sd.checked = Date.now();
    await db.doc('league/players').set(pd);
    await db.doc('nll/status').set(sd);
    for(const tid of changedT) await db.doc('teams/'+tid).update({roster:T[tid].roster||[], ir:T[tid].ir||[]});
    for(const l of logs) await logTx(l);
    S.nllPv = null; S.nllDraft = '';

}

async function buildBoxPreview(text, w){
  const bx = parseBox(text);
  if(!bx.rows.length){ S.preview = {error:'No players found. Paste the box score starting at the first “#”, with both teams’ Runner and Goalie tables.'}; return; }
  if(!S.extra){ try { const d = await db.doc('nll/extra').get(); S.extra = d.exists ? (d.data().players || {}) : {}; } catch(e){ S.extra = {}; } }
  const pIdx = nameIndex(S.players), xIdx = nameIndex(S.extra);
  // which NLL team is each block? majority of matched pool players, else the order in the game link
  const teams = [];
  for(let ti = 0; ti < Math.max(bx.nTeams, 1); ti++){
    const cnt = {};
    bx.rows.filter(r=>r.ti===ti).forEach(r => { const id = findIn(pIdx, S.players, r.name); const t = id && S.players[id].t; if(t) cnt[t] = (cnt[t]||0)+1; });
    const best = Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
    teams[ti] = best && best[1] >= 3 ? best[0] : (bx.slugTeams[ti] || (best && best[0]) || '');
  }
  const wk = weekOfDate(bx.date, teams.filter(Boolean));
  const week = wk && wk.fw ? wk.fw : w;
  const rows = [];
  for(const r of bx.rows){
    const line = boxLine(r, bx.pts); if(!line) continue;
    const team = teams[r.ti] || '';
    let pid = findIn(pIdx, S.players, r.name, team), src = 'pool', xid = null;
    if(!pid){ xid = findIn(xIdx, S.extra, r.name); src = xid ? 'extra' : 'new'; }
    const pos = pid ? S.players[pid].pos : xid ? S.extra[xid].pos : (r.goalie ? 'G' : 'F');
    rows.push({ti:r.ti, name:r.name, num:r.num, team, goalie:r.goalie, pid, xid, src, pos, s:line});
  }
  const goals = teams.map((t,ti) => bx.rows.filter(r=>r.ti===ti && !r.goalie).reduce((a,r)=>a + (+r.raw.G||0), 0));
  const gid = bx.gid || `${teams.join('-')}-${bx.date || 'w'+week}`;
  let dupW = null, dupGid = null;
  for(const [k, st] of Object.entries(S.stats)) for(const [id, g] of Object.entries(st.games||{})){
    const same = id === gid || (teams.length === 2 && teams.every(t => t && [g.a, g.h].includes(t)) && (bx.date && g.date ? g.date === bx.date : +k === week));
    if(same && !dupW){ dupW = [k]; dupGid = id; }
  }
  S.statWeek = week;
  if(dupW && !bx.hasSum){ const old = S.stats[dupW[0]].games[dupGid]; rows.forEach(r => { const o = r.pid && old.p?.[r.pid]; if(r.goalie && o){ r.s.g = o.g||0; r.s.a = o.a||0; } }); }
  S.preview = {box:true, week, wk, gid, date:bx.date, teams, goals, rows, hasSum:bx.hasSum, dup: dupW ? +dupW[0] : null, dupGid,
    gPts: rows.filter(r=>r.goalie && (r.s.g||r.s.a))};
}
async function buildPreview(){
  const text = $('#statText')?.value || '';
  const w = +($('#statWeek')?.value || cfg().currentWeek), mode = $('#statMode')?.value || 'week';
  S.statWeek = w; S.statMode = mode; S.statDraft = text;
  if(isBox(text)) return buildBoxPreview(text, w);
  if(isSummary(text)) return buildSumPreview(text);
  const res = parseTable(text);
  if(res.error){ S.preview = {error:res.error}; return; }
  const byKey = {}; for(const [pid,P] of Object.entries(S.players)) byKey[keyOf(P.n)] = pid;
  const rows = res.rows.map(r => ({...r, pid: byKey[keyOf(r.name)] || null, guess: r.pos || (('sv' in r || 'ga' in r) ? 'G' : 'F')}));
  const fields = res.fields;
  if(!fields.length){ S.preview = {error:'No stat columns found. Include headings like G, A, LB, TO, CTO, Blocked, SV, GA.'}; return; }
  // compute the per-week line for each row
  const out = rows.map(r => {
    const s = {};
    for(const f of fields){

      if(mode==='season' && r.pid){ for(let k=1;k<w;k++){ v -= (S.stats[k]?.p?.[r.pid]?.[f] || 0); } }
      s[f] = Math.round(v*100)/100;
    }
    return {name:r.name, pid:r.pid, pos: r.pid ? pl(r.pid).pos : r.guess, s};
  });
  S.preview = {week:w, mode, fields, rows, out};
}
async function saveStats(){
  const pv = S.preview; if(!pv || pv.error) return;
  await run(async () => {
    const players = clone(S.players) || {};
    const used = new Set(Object.keys(players));
    const newOnes = pv.rows.filter(r=>!r.pid);
    newOnes.forEach((r,i) => {
      const pos = $('#np-'+i)?.value || r.guess;
      let id = slug(r.name), n = 2; while(used.has(id)) id = slug(r.name)+'-'+(n++);
      used.add(id); r.pid = id; players[id] = {n:r.name, pos, t:(r.team||'').toUpperCase()};
    });
    pv.rows.forEach(r => { if(r.team && players[r.pid] && !players[r.pid].t) players[r.pid].t = r.team.toUpperCase(); });
    if(newOnes.length) await db.doc('league/players').set({p:players});
    const prev = S.stats[pv.week] || {};
    const cur = clone(prev.games ? prev.man : prev.p) || {};
    pv.rows.forEach((r,idx) => {
      const s = pv.out[idx].s;
      if(pv.mode==='season'){
        const played = 'gp' in s ? s.gp > 0 : Object.values(s).some(v=>v);
        if(!played){ if(cur[r.pid]){ for(const f of pv.fields) delete cur[r.pid][f]; if(!Object.keys(cur[r.pid]).length) delete cur[r.pid]; } return; }
      }
      cur[r.pid] = Object.assign(cur[r.pid] || {}, s);
    });
    const games = prev.games || {};
    await db.doc('stats/w'+pv.week).set({week:pv.week, man:cur, games, p:sumWeek(cur, games), updated:Date.now()});
    S.preview = null; S.statDraft = '';
  }, `Saved stats for ${weekName(pv.week)}`);

function rerank(players){
  Object.keys(players).filter(k => players[k].proj != null).sort((a,b) => players[b].proj - players[a].proj).forEach((k,i) => players[k].rk = i+1);
}
async function saveGame(){
  const pv = S.preview; if(!pv || !pv.box) return;
  const week = +($('#gameWeek')?.value || pv.week);
  await run(async () => {
    const players = clone(S.players) || {}, used = new Set(Object.keys(players)); let changed = false;
    const today = new Date().toISOString().slice(0,10);
    pv.rows.forEach((r,i) => {
      if(r.pid && players[r.pid]) return;
      let id = r.xid || slug(r.name), n = 2; const base = id; while(used.has(id)) id = base+'-'+(n++);
      if(r.src === 'extra'){
        const x = S.extra[r.xid];
        players[id] = {n:x.n, pos:x.pos, t:r.team || x.t || '', added:today};
        for(const f of ['proj','gp3','ls','rook','role']) if(x[f] != null) players[id][f] = x[f];
      } else {
        players[id] = {n:r.name, pos: $('#np-'+i)?.value || r.pos, t:r.team, added:today};
      }
      used.add(id); r.pid = id; changed = true;
    });
    if(changed){ rerank(players); await db.doc('league/players').set({p:players}); }
    if(!pv.date){ // no date in the paste: the same game is the same two teams in the week you save to
      const hit = Object.entries(S.stats[week]?.games||{}).find(([id,g]) => pv.teams.every(t => t && [g.a,g.h].includes(t)));
      pv.dup = hit ? week : null; pv.dupGid = hit ? hit[0] : null; pv.gid = `${pv.teams.join('-')}-w${week}`;
    }
    // a game re-pasted into a different week moves there
    if(pv.dup && pv.dup !== week){ const o = clone(S.stats[pv.dup]); delete o.games[pv.dupGid]; o.p = sumWeek(o.man, o.games); o.updated = Date.now(); await db.doc('stats/w'+pv.dup).set(o); }
    const prev = S.stats[week] || {};
    const games = clone(prev.games) || {}, man = clone(prev.games ? prev.man : prev.p) || {};
    const old = pv.dup === week ? games[pv.dupGid] : null;
    if(old) delete games[pv.dupGid];
    // keep goalie points from an earlier summary if this paste has none
    const gidKeep = !pv.date && old ? pv.dupGid : pv.gid;
    const gp = {}; pv.rows.forEach(r => { gp[r.pid] = Object.assign(gp[r.pid] || {}, r.s); });
    games[gidKeep] = {a:pv.teams[0]||'', h:pv.teams[1]||'', ga:pv.goals[0], gh:pv.goals[1], date:pv.date || old?.date || '', p:gp, ts:Date.now()};
    await db.doc('stats/w'+week).set({week, man, games, p:sumWeek(man, games), updated:Date.now()});
    S.preview = null; S.statDraft = ''; S.statWeek = week;
  }, `Saved ${pv.teams.join(' vs ')} to ${weekName(week)}`);
}
async function delGame(w, gid){
  await run(async () => {
    const o = clone(S.stats[w]); if(!o?.games?.[gid]) return;
    delete o.games[gid]; o.p = sumWeek(o.man, o.games); o.updated = Date.now();
    if(!Object.keys(o.p).length) await db.doc('stats/w'+w).delete(); else await db.doc('stats/w'+w).set(o);
  }, 'Game removed');
}
async function goalieAst(w, gid, pid, d){
  await run(async () => {
    const o = clone(S.stats[w]); const x = o?.games?.[gid]?.p?.[pid]; if(!x) return;
    x.a = Math.max(0, (x.a||0) + d);
    o.p = sumWeek(o.man, o.games); o.updated = Date.now();
    await db.doc('stats/w'+w).set(o);
  }, d > 0 ? `Assist added for ${pl(pid).n}` : `Assist removed for ${pl(pid).n}`);
}

async function importPool(){
  const text = $('#poolText')?.value || '';

  if(res.error) return toast(res.error, true);
  if(!res.rows.length) return toast('No players found in that paste.', true);
  await run(async () => {
    const players = clone(S.players) || {};
    const byKey = {}; for(const [pid,P] of Object.entries(players)) byKey[keyOf(P.n)] = pid;
    let added = 0, updated = 0;
    for(const r of res.rows){
      const id0 = byKey[keyOf(r.name)];
      if(id0){ const P = players[id0]; if(r.team) P.t = r.team.toUpperCase(); if(r.pos) P.pos = r.pos; if(r.rank) P.rk = r.rank; updated++; continue; }
      let id = slug(r.name), n = 2; while(players[id]) id = slug(r.name)+'-'+(n++);
      players[id] = {n:r.name, pos:r.pos||'F', t:(r.team||'').toUpperCase()}; if(r.rank) players[id].rk = r.rank;
      byKey[keyOf(r.name)] = id; added++;
    }
    await db.doc('league/players').set({p:players});
    S.poolDraft = '';
    toast(`${added} added, ${updated} updated`);
  });
}
